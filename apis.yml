name: Topography
description: 'Topography (Topography Health, Inc.) was a full-stack clinical trials
  platform that empowered community and private-practice physicians to run clinical
  drug trials in their local communities across North America, reducing the administrative
  burden of becoming a clinical trialist. Founded in 2020 by Alexander Saint-Amand,
  Mac Parish, and Andrew Kirchner and based in New York and Los Angeles, the company
  launched in January 2022 with $27.5M in funding, including a $21.5M Series A led
  by Bain Capital Ventures and Andreessen Horowitz (a16z). In 2026 Topography Health''s
  Site Business Unit was acquired by FOMAT Medical Research, and the company''s public
  site is now a single-page acquisition announcement. Topography was a B2B clinical-research
  SaaS, not a developer-facing API company: no public developer portal, API documentation,
  OpenAPI, SDKs, or other machine-readable API surface was ever published, and none
  exists today.'
